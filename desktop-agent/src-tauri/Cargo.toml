[package]
name = "auto-agent-pc"
version = "0.1.0"
description = "Permission-controlled Auto Windows companion"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
dirs = "6"
screenshots = "0.8"
enigo = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
