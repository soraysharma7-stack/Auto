name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, unit test, PostgreSQL integration test and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e

  windows-companion:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install companion dependencies
        run: npm ci --prefix desktop-agent
      - name: Compile the native Windows companion without packaging
        shell: bash
        run: |
          set +e
          log="/tmp/auto-tauri-build.log"
          NO_COLOR=1 npm run tauri:build --prefix desktop-agent -- --debug --no-bundle --ci -v > "$log" 2>&1
          build_exit=$?
          cat "$log"
          if [ "$build_exit" -ne 0 ]; then
            tail -n 100 "$log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$build_exit"
          fi
