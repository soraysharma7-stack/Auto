name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, unit test, PostgreSQL integration test and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e

  windows-companion:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install companion dependencies
        run: npm ci --prefix desktop-agent
      - name: Build frontend and compile the native Windows companion
        shell: bash
        run: |
          set +e
          report_failure() {
            local status="$1"
            local log="$2"
            tail -n 100 "$log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          }
          NO_COLOR=1 npm run build --prefix desktop-agent > /tmp/auto-frontend-build.log 2>&1
          frontend_exit=$?
          if [ "$frontend_exit" -ne 0 ]; then
            report_failure "$frontend_exit" /tmp/auto-frontend-build.log
          fi
          echo "Companion frontend built; starting Cargo"
          cd desktop-agent/src-tauri
          CARGO_TERM_COLOR=never cargo build --verbose > /tmp/auto-cargo-build.log 2>&1
          cargo_exit=$?
          if [ "$cargo_exit" -ne 0 ]; then
            report_failure "$cargo_exit" /tmp/auto-cargo-build.log
          fi
          echo "Native Cargo build completed"
