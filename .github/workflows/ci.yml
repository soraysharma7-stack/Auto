name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, unit test, PostgreSQL integration test and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e

  windows-companion:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install companion dependencies
        run: npm ci --prefix desktop-agent
      - name: Compile the native Windows companion without packaging
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "auto-tauri-build.log"
          & npm run tauri:build --prefix desktop-agent -- --debug --no-bundle *>&1 | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content $log -Tail 100 | ForEach-Object {
              $line = $_.ToString().Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error::$line"
            }
            exit $buildExit
          }
